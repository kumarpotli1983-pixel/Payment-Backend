<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google OAuth SignIn</title>
</head>
<body>
  <button id="loginButton">"SignIn with Google"</button>
  <script>
    const onLoginButtonClick = ()=>{
      window.location.href="http://localhost:3500/api/v2/auth/google"
    }
    document.getElementById('loginButton')
            .addEventListener('click',onLoginButtonClick)

  </script>
</body>
</html>
